# Packaging metadata for `flet build` only (scripts/tools/build_flet.py copies it
# into a clean staging folder with the sources). Development uses pixi, not this file.
# Dependencies are fetched by `flet build` from PyPI for the target platform.

[project]
name = "iwaratool"
version = "0.0.0" # replaced with app/version.py by build_flet.py
description = "Iwara browser and downloader"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flet==1.1.3",
  "flet-video==1.1.3",
  "requests>=2.32.5,<3",
  "cloudscraper>=1.2.71",
]

[tool.flet]
product = "IwaraTool"
artifact = "IwaraTool"
org = "io.github.moeary"
company = "Moeary"
copyright = "Copyright (c) 2026 Moeary. MIT License."

[tool.flet.app]
path = "."
module = "main_flet"

# Android (docs/flet_ui_plan.md 8): built in CI (`build_flet.py --platform apk`).
# Remote videos play through the loopback stream proxy at http://127.0.0.1,
# which Android refuses unless cleartext traffic is allowed.
[tool.flet.android.manifest_application]
usesCleartextTraffic = true
