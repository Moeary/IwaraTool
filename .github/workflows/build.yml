name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Desktop builds, for tags and on demand.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true

      - name: Run tests
        run: pixi run test

      # Flet's Flutter plugins (connectivity_plus 7.3+) use macOS 26 SDK APIs
      # such as NWPath.isUltraConstrained; the runner's default Xcode 16 lacks them.
      - name: Select the newest Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls -d /Applications/Xcode_*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          # Read the whole output first: piping xcodebuild into head makes it
          # die of a broken pipe, which pipefail turns into a failed step.
          version=$(xcodebuild -version)
          echo "$version"
          major=$(sed -nE '1s/^Xcode ([0-9]+).*/\1/p' <<<"$version")
          if [ "$major" -lt 26 ]; then echo "::error::Flet's macOS build needs Xcode 26 or newer, the runner has $major"; exit 1; fi

      # Stages a clean copy, runs flet build, audits for Qt, launches the
      # result in smoke-test mode and zips it into dist/.
      - name: Build, audit and smoke-test
        shell: bash
        run: pixi run build --label "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}-${{ runner.arch }}
          path: dist/IwaraTool-*.zip
          if-no-files-found: error

  # Android APK (docs/flet_ui_plan.md 8). The Ubuntu image ships the Android
  # SDK; flet build installs Flutter. No smoke test: an APK needs a device, so
  # real-device checks stay manual.
  #
  # Signing: Android installs an update only over a copy signed with the same
  # certificate, so every release is signed with one long-lived key from the
  # secrets ANDROID_KEYSTORE_BASE64 (the .jks, base64), ANDROID_KEYSTORE_PASSWORD
  # and ANDROID_KEY_ALIAS (default "upload"). build.py checks the APK's
  # certificate against packaging/app/android_cert_sha256.txt; a tag refuses to
  # build without the key. Builds on demand without the secrets fall back to a
  # debug key (installable, but not as an update of a release).
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true

      - name: Run tests
        run: pixi run test

      - name: Build, sign and audit the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          args=(--platform apk --label "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}")
          keystore="$RUNNER_TEMP/iwaratool-release.jks"
          trap 'rm -f "$keystore"' EXIT
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" > "$keystore"
            export FLET_ANDROID_SIGNING_KEY_STORE="$keystore"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--require-signing)
          fi
          pixi run build "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-Android
          path: dist/IwaraTool-Android*.apk
          if-no-files-found: error

  # Start the APK on emulators shaped like a phone, a foldable and a tablet:
  # it must keep running for 90 s with no Python traceback; screenshots are kept.
  # Real devices stay a manual check (docs/flet_ui_plan.md P8).
  android-emulator:
    needs: build-android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: phone
            profile: pixel_6
            setup: ""
          - label: phone-21x9
            profile: pixel_6
            setup: size:1080x2520
          - label: foldable
            profile: pixel_fold
            setup: ""
          - label: foldable-folded
            profile: pixel_fold
            setup: fold
          - label: tablet
            profile: pixel_tablet
            setup: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: build-Android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/tools/android_smoke.sh "$(ls apk/*.apk | head -1)" emulator-out ${{ matrix.label }} "${{ matrix.setup }}"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ matrix.label }}
          path: emulator-out/
          if-no-files-found: warn

  # The APK ships only if it started on every emulator.
  release:
    needs: [build, build-android, android-emulator]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Select release notes
        shell: bash
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "RELEASE_NOTES_PATH=$NOTES" >> "$GITHUB_ENV"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: ${{ env.RELEASE_NOTES_PATH == '' }}
          files: dist/IwaraTool*
          fail_on_unmatched_files: true
          draft: false
          # Every tag starts as a pre-release, so the in-app update check
          # (/releases/latest skips pre-releases) does not offer an untested
          # build. After testing, publish it with:
          #   gh release edit <tag> --prerelease=false --latest
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
