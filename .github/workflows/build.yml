name: Build Desktop Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pixi run test

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [ "$VERSION" == "$GITHUB_REF" ] && VERSION="latest"
          pixi run python -m nuitka \
            --assume-yes-for-downloads \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --windows-console-mode=disable \
            --include-package-data=cloudscraper \
            --windows-icon-from-ico=app/icon.ico \
            --include-data-file=app/icon.ico=app/icon.ico \
            --include-data-file=app/data/tag_translations/loveiwara_iwara_tags_localized.json=app/data/tag_translations/loveiwara_iwara_tags_localized.json \
            --include-data-file=app/data/oreno3d_iwara_map.json=app/data/oreno3d_iwara_map.json \
            --output-filename="IwaraTool-Windows-AMD64-${VERSION}.exe" \
            --output-dir=dist \
            --remove-output \
            main.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [ "$VERSION" == "$GITHUB_REF" ] && VERSION="latest"
          pixi run python -m nuitka \
            --assume-yes-for-downloads \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --include-package-data=cloudscraper \
            --include-data-file=app/icon.ico=app/icon.ico \
            --include-data-file=app/data/tag_translations/loveiwara_iwara_tags_localized.json=app/data/tag_translations/loveiwara_iwara_tags_localized.json \
            --include-data-file=app/data/oreno3d_iwara_map.json=app/data/oreno3d_iwara_map.json \
            --output-filename="IwaraTool-Linux-AMD64-${VERSION}" \
            --output-dir=dist \
            --remove-output \
            main.py

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in IwaraTool*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IwaraTool-${{ runner.os }}
          path: |
            dist/*
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/IwaraTool*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
