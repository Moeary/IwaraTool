name: Build Desktop Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pixi run test

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: pixi run test

      # Version resources always; Authenticode signing when the repository has a
      # code-signing certificate in the WINDOWS_SIGN_PFX_BASE64 / _PASSWORD secrets.
      - name: Build and sign (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [ "$VERSION" == "$GITHUB_REF" ] && VERSION="latest"
          pixi run python scripts/build_windows.py --output-filename="IwaraTool-Windows-AMD64-${VERSION}.exe"

      # SignPath Foundation signing for tagged releases. Skipped until the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN are set; every request waits for manual approval in SignPath.
      - name: Upload unsigned exe for SignPath (Windows)
        id: upload-unsigned
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-exe  # outside the release's IwaraTool-* pattern
          path: dist/IwaraTool-Windows-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath (Windows)
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'IwaraTool' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed exe (Windows)
        if: steps.upload-unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist-signed -Recurse -Filter 'IwaraTool-Windows-*.exe'
          if (-not $signed) { throw 'SignPath returned no exe' }
          foreach ($file in $signed) {
            $status = (Get-AuthenticodeSignature $file.FullName).Status
            if ($status -ne 'Valid') { throw "Signature of $($file.Name) is $status" }
            Copy-Item $file.FullName (Join-Path dist $file.Name) -Force
          }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [ "$VERSION" == "$GITHUB_REF" ] && VERSION="latest"
          pixi run python -m nuitka \
            --assume-yes-for-downloads \
            --standalone \
            --onefile \
            --static-libpython=no \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --include-package-data=cloudscraper \
            --include-data-file=app/icon.ico=app/icon.ico \
            --include-data-file=app/data/tag_translations/loveiwara_iwara_tags_localized.json=app/data/tag_translations/loveiwara_iwara_tags_localized.json \
            --include-data-file=app/data/oreno3d_iwara_map.json=app/data/oreno3d_iwara_map.json \
            --output-filename="IwaraTool-Linux-AMD64-${VERSION}" \
            --output-dir=dist \
            --remove-output \
            main.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pixi run build

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in IwaraTool*; do
            case "$f" in *.sha256) continue ;; esac
            if [ "$RUNNER_OS" = "macOS" ]; then
              shasum -a 256 "$f" > "$f.sha256"
            else
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IwaraTool-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: IwaraTool-*
          merge-multiple: true
          path: dist

      - name: Select release notes
        shell: bash
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "RELEASE_NOTES_PATH=$NOTES" >> "$GITHUB_ENV"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: ${{ env.RELEASE_NOTES_PATH == '' }}
          files: dist/IwaraTool*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
