name: Build Desktop Binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which interface to build (Flet builds never enter a release)
        type: choice
        options: [legacy, flet, all]
        default: legacy
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'flet'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pixi run test

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: pixi run test

      # Version resources always; Authenticode signing when the repository has a
      # code-signing certificate in the WINDOWS_SIGN_PFX_BASE64 / _PASSWORD secrets.
      - name: Build and sign (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [ "$VERSION" == "$GITHUB_REF" ] && VERSION="latest"
          pixi run python scripts/tools/build_windows.py --output-filename="IwaraTool-Windows-AMD64-${VERSION}.exe"

      # SignPath Foundation signing for tagged releases. Skipped until the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN are set; every request waits for manual approval in SignPath.
      - name: Upload unsigned exe for SignPath (Windows)
        id: upload-unsigned
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-exe  # outside the release's IwaraTool-* pattern
          path: dist/IwaraTool-Windows-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath (Windows)
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'IwaraTool' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed exe (Windows)
        if: steps.upload-unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist-signed -Recurse -Filter 'IwaraTool-Windows-*.exe'
          if (-not $signed) { throw 'SignPath returned no exe' }
          foreach ($file in $signed) {
            $status = (Get-AuthenticodeSignature $file.FullName).Status
            if ($status -ne 'Valid') { throw "Signature of $($file.Name) is $status" }
            Copy-Item $file.FullName (Join-Path dist $file.Name) -Force
          }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          [ "$VERSION" == "$GITHUB_REF" ] && VERSION="latest"
          pixi run python -m nuitka \
            --assume-yes-for-downloads \
            --standalone \
            --onefile \
            --static-libpython=no \
            --enable-plugin=pyside6 \
            --include-qt-plugins=multimedia \
            --include-package-data=cloudscraper \
            --include-data-file=app/icon.ico=app/icon.ico \
            --include-data-file=app/data/tag_translations/loveiwara_iwara_tags_localized.json=app/data/tag_translations/loveiwara_iwara_tags_localized.json \
            --include-data-file=app/data/oreno3d_iwara_map.json=app/data/oreno3d_iwara_map.json \
            --output-filename="IwaraTool-Linux-AMD64-${VERSION}" \
            --output-dir=dist \
            --remove-output \
            main.py

      # scripts/tools/build_macos.py rewrites library references that still point at
      # this runner's pixi environment, re-signs (ad-hoc), audits every Mach-O,
      # launches the bundle with DYLD_PRINT_LIBRARIES, builds the DMG and
      # launches again from the mounted DMG; any failure stops the release.
      - name: Build, repair and verify (macOS)
        if: runner.os == 'macOS'
        run: pixi run build

      - name: Verify DMG image (macOS)
        if: runner.os == 'macOS'
        run: |
          for dmg in dist/IwaraTool-macOS-*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IwaraTool-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*
          if-no-files-found: error

  # Flet interface (v1.3.0 trial), on demand only. Its artifacts are named
  # flet-* so the release job's IwaraTool-* pattern never picks them up.
  build-flet:
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'legacy'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true
          environments: flet

      - name: Run Flet tests
        run: pixi run -e flet test-flet

      # Flet's Flutter plugins (connectivity_plus 7.3+) use macOS 26 SDK APIs
      # such as NWPath.isUltraConstrained; the runner's default Xcode 16 lacks them.
      - name: Select the newest Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls -d /Applications/Xcode_*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          # Read the whole output first: piping xcodebuild into head makes it
          # die of a broken pipe, which pipefail turns into a failed step.
          version=$(xcodebuild -version)
          echo "$version"
          major=$(sed -nE '1s/^Xcode ([0-9]+).*/\1/p' <<<"$version")
          if [ "$major" -lt 26 ]; then echo "::error::Flet's macOS build needs Xcode 26 or newer, the runner has $major"; exit 1; fi

      # Stages a clean copy, runs flet build, audits for Qt/app/ui, launches the
      # result in smoke-test mode and zips it into dist/.
      - name: Build, audit and smoke-test
        shell: bash
        run: pixi run -e flet build-flet --label "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flet-${{ runner.os }}-${{ runner.arch }}
          path: dist/IwaraTool-Flet-*.zip
          if-no-files-found: error

  # Android APK of the Flet interface (docs/flet_ui_plan.md 8). The Ubuntu image
  # ships the Android SDK; flet build installs Flutter. No smoke test: an APK
  # needs a device, so real-device checks stay manual.
  build-flet-android:
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'legacy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          locked: true
          environments: flet

      - name: Run Flet tests
        run: pixi run -e flet test-flet

      - name: Build and audit the APK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          pixi run -e flet build-flet --platform apk --label "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flet-Android
          path: dist/IwaraTool-Flet-Android*.apk
          if-no-files-found: error

  # Start the APK on emulators shaped like a phone, a foldable and a tablet:
  # it must keep running for 90 s with no Python traceback; screenshots are kept.
  # Real devices stay a manual check (docs/flet_ui_plan.md P8).
  android-emulator:
    needs: build-flet-android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: phone
            profile: pixel_6
            setup: ""
          - label: phone-21x9
            profile: pixel_6
            setup: size:1080x2520
          - label: foldable
            profile: pixel_fold
            setup: ""
          - label: foldable-folded
            profile: pixel_fold
            setup: fold
          - label: tablet
            profile: pixel_tablet
            setup: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: flet-Android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/tools/android_smoke.sh "$(ls apk/*.apk | head -1)" emulator-out ${{ matrix.label }} "${{ matrix.setup }}"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ matrix.label }}
          path: emulator-out/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: IwaraTool-*
          merge-multiple: true
          path: dist

      - name: Select release notes
        shell: bash
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "RELEASE_NOTES_PATH=$NOTES" >> "$GITHUB_ENV"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: ${{ env.RELEASE_NOTES_PATH == '' }}
          files: dist/IwaraTool*
          fail_on_unmatched_files: true
          draft: false
          # Every tag starts as a pre-release, so the in-app update check
          # (/releases/latest skips pre-releases) does not offer an untested
          # build. After testing, publish it with:
          #   gh release edit <tag> --prerelease=false --latest
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
