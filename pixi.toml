[workspace]
authors = ["Moeary"]
channels = ["conda-forge"]
name = "IwaraTool"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
version = "1.3.0"

[dependencies]
python = "3.12.*"
requests = ">=2.32.5,<3"

[pypi-dependencies]
cloudscraper = ">=1.2.71"
flet = { version = "==1.1.3", extras = ["desktop", "cli"] }
flet-video = "==1.1.3"

[tasks]
start = "python main.py"
test = "python -X faulthandler -m unittest discover -s scripts/tests -t scripts/tests -p \"test_*.py\""
theme-gallery = "python scripts/tools/theme_gallery.py"
build = "python scripts/tools/build.py"
crawl = "python scripts/tools/crawl_iwara_tags.py"

# conda-forge 的 openssl 激活脚本会把 SSL_CERT_DIR 指向空的 Library\ssl\certs，
# 在已激活的终端里再执行 pixi 会警告 “ignoring SSL_CERT_DIR: no certificates found”。
# 激活后清掉它即可：OpenSSL 仍通过 SSL_CERT_FILE（cacert.pem）找到根证书。
[target.win-64.activation.env]
SSL_CERT_DIR = ""
