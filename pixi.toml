[workspace]
authors = ["Moeary"]
channels = ["conda-forge"]
name = "IwaraTool"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
version = "1.1.3"

[tasks]
start = "python main.py"
crawl = "python app/core/crawl_iwara_tags.py"
test = "python -X faulthandler -m unittest discover -s tests -p \"test_*.py\""
build = "nuitka --standalone --onefile --enable-plugin=pyside6 --include-qt-plugins=multimedia --windows-console-mode=disable --include-package-data=cloudscraper --windows-icon-from-ico=app/icon.ico --include-data-file=app/icon.ico=app/icon.ico --include-data-file=app/data/tag_translations/loveiwara_iwara_tags_localized.json=app/data/tag_translations/loveiwara_iwara_tags_localized.json --include-data-file=app/data/oreno3d_iwara_map.json=app/data/oreno3d_iwara_map.json --output-filename=IwaraTool.exe --output-dir=dist --remove-output main.py"

[target.win-64.tasks]
build = "python scripts/build_windows.py"

# conda-forge 的 openssl 激活脚本会把 SSL_CERT_DIR 指向空的 Library\ssl\certs，
# 在已激活的终端里再执行 pixi 会警告 “ignoring SSL_CERT_DIR: no certificates found”。
# 激活后清掉它即可：OpenSSL 仍通过 SSL_CERT_FILE（cacert.pem）找到根证书。
[target.win-64.activation.env]
SSL_CERT_DIR = ""

[target.osx-arm64.tasks]
build = "python scripts/build_macos.py"

[target.osx-64.tasks]
build = "python scripts/build_macos.py"

[target.osx-arm64.pypi-dependencies]
pyside6 = "==6.6.2"

[target.osx-64.pypi-dependencies]
pyside6 = "==6.6.2"

[target.win-64.dependencies]
pyside6 = "==6.6.2"

[target.linux-64.dependencies]
pyside6 = "==6.6.2"

[dependencies]
python = "3.11.*"
requests = ">=2.32.5,<3"
#下面是编译要用的 Following are for build dependencies
zstandard = ">=0.25.0,<0.26" 
nuitka = ">=2.8.9,<3"

[pypi-dependencies]
pyside6-fluent-widgets = ">=1.10.2, <2"
cloudscraper = ">=1.2.71"
