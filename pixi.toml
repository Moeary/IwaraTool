[workspace]
authors = ["Moeary"]
channels = ["conda-forge"]
name = "IwaraTool"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
version = "1.2.3"

# 两套界面共用的核心依赖（同一份版本范围）。界面相关的依赖与 Python 版本分别放在
# 下面的 qt / flet feature 里。两个环境暂不共用 solve-group：Flet 打包只支持
# Python 3.12+，而 Python 3.12 + Nuitka 2.8 + shiboken6 6.6.2 编出的旧界面包在
# 导入 shiboken6 时段错误（Shiboken::init → PyType_Ready），旧界面因此留在 3.11，
# 升级 PySide6 后再统一（见 docs/flet_ui_plan.md 2.3）。
[dependencies]
requests = ">=2.32.5,<3"

[pypi-dependencies]
cloudscraper = ">=1.2.71"

[tasks]
crawl = "python scripts/tools/crawl_iwara_tags.py"

# conda-forge 的 openssl 激活脚本会把 SSL_CERT_DIR 指向空的 Library\ssl\certs，
# 在已激活的终端里再执行 pixi 会警告 “ignoring SSL_CERT_DIR: no certificates found”。
# 激活后清掉它即可：OpenSSL 仍通过 SSL_CERT_FILE（cacert.pem）找到根证书。
[target.win-64.activation.env]
SSL_CERT_DIR = ""

# ── 旧界面：PySide6 + Nuitka（default 环境）──
[feature.qt.dependencies]
python = "3.11.*"
#下面是编译要用的 Following are for build dependencies
zstandard = ">=0.25.0,<0.26"
nuitka = ">=2.8.9,<3"

[feature.qt.pypi-dependencies]
pyside6-fluent-widgets = ">=1.10.2, <2"

[feature.qt.target.win-64.dependencies]
pyside6 = "==6.6.2"

[feature.qt.target.linux-64.dependencies]
pyside6 = "==6.6.2"

[feature.qt.target.osx-arm64.pypi-dependencies]
pyside6 = "==6.6.2"
dmgbuild = ">=1.6"

[feature.qt.target.osx-64.pypi-dependencies]
pyside6 = "==6.6.2"
dmgbuild = ">=1.6"

[feature.qt.tasks]
start = "python main.py"
test = "python -X faulthandler -m unittest discover -s scripts/tests -p \"test_*.py\""
build = "nuitka --standalone --onefile --enable-plugin=pyside6 --include-qt-plugins=multimedia --windows-console-mode=disable --include-package-data=cloudscraper --windows-icon-from-ico=app/icon.ico --include-data-file=app/icon.ico=app/icon.ico --include-data-file=app/data/tag_translations/loveiwara_iwara_tags_localized.json=app/data/tag_translations/loveiwara_iwara_tags_localized.json --include-data-file=app/data/oreno3d_iwara_map.json=app/data/oreno3d_iwara_map.json --output-filename=IwaraTool.exe --output-dir=dist --remove-output main.py"

[feature.qt.target.win-64.tasks]
build = "python scripts/tools/build_windows.py"

# 测试文件默认 QT_QPA_PLATFORM=offscreen；macOS 上 qframelesswindow 会把
# offscreen 的 winId 当成 NSView 交给 PyObjC，创建主窗口时直接段错误，
# 因此 macOS 的测试与 CI 一样固定使用 cocoa。
[feature.qt.target.osx-arm64.tasks]
build = "python scripts/tools/build_macos.py"
test = { cmd = "python -X faulthandler -m unittest discover -s scripts/tests -p \"test_*.py\"", env = { QT_QPA_PLATFORM = "cocoa" } }

[feature.qt.target.osx-64.tasks]
build = "python scripts/tools/build_macos.py"
test = { cmd = "python -X faulthandler -m unittest discover -s scripts/tests -p \"test_*.py\"", env = { QT_QPA_PLATFORM = "cocoa" } }

# ── Flet 前端（v1.3.0 试验，见 docs/flet_ui_plan.md）──
# 不含 PySide6，运行时不可能导入 Qt。
[feature.flet.dependencies]
python = "3.12.*"

[feature.flet.pypi-dependencies]
flet = { version = "==1.1.3", extras = ["desktop", "cli"] }

[feature.flet.tasks]
start-flet = { cmd = "python main_flet.py", env = { IWARATOOL_NO_QT = "1", IWARATOOL_DATA_DIR = "data-flet" } }
theme-gallery = { cmd = "python scripts/tools/flet_theme_gallery.py", env = { IWARATOOL_NO_QT = "1" } }
# 测试分三层：scripts/tests/core（两个环境都跑）、qt（只在 default 环境）、flet_ui（Flet 用例在无 Flet 时跳过）。
test-flet = { cmd = "python -X faulthandler -m unittest discover -s scripts/tests/core -t scripts/tests && python -X faulthandler -m unittest discover -s scripts/tests/flet_ui -t scripts/tests", env = { IWARATOOL_NO_QT = "1" } }

[environments]
default = { features = ["qt"] }
flet = { features = ["flet"] }
